<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }} — Obsidian Theme</title>
    <meta name="description" content="{{ site.description }}" />
    <meta property="og:title" content="{{ site.title }} — Obsidian Theme" />
    <meta property="og:description" content="{{ site.description }}" />
    <meta property="og:image" content="{{ '/assets/img/screenshot.png' | absolute_url }}" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238ab4fa' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        Blue Night
      </a>
      <nav>
        <a href="#features">Features</a>
        <a href="#flavors">Flavors</a>
        <a href="#install">Install</a>
        <a href="#snippets">Snippets</a>
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>
        Blue Night — made with care by
        <a href="https://github.com/sandovaldavid">sandovaldavid</a> · MIT License
      </p>
    </footer>
  </body>
</html>
